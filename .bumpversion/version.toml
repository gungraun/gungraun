[tool.bumpversion]
current_version = "0.20.1"
commit = true
message = "Bump version v{current_version} -> v{new_version}"

# The guide in `docs/src `is not updated here but instead in the Justfile with
# `just bump`

[[tool.bumpversion.files]]
filename = "{repo_root}/Cargo.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "{repo_root}/crates/gungraun/Cargo.toml"
search = 'path = "../gungraun-runner", version = "={current_version}"'
replace = 'path = "../gungraun-runner", version = "={new_version}"'

[[tool.bumpversion.files]]
filename = "{repo_root}/crates/gungraun/src/__internal/mod.rs"
search = "const LIBRARY_VERSION: &str = \"{current_version}\""
replace = "const LIBRARY_VERSION: &str = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "{repo_root}/README.md"
