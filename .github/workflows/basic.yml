# spell-checker:ignore rustdocflags binutils androideabi

name: Basic checks

on:
  workflow_call:
    inputs:
      cargo_term_color:
        required: false
        type: string
      rust_backtrace:
        required: false
        type: string

env:
  CARGO_TERM_COLOR: ${{ inputs.cargo_term_color }}
  RUST_BACKTRACE: ${{ inputs.rust_backtrace }}

jobs:
  deny:
    name: Check dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - "--deny warnings advisories"
          - bans licenses sources
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  minimal_versions:
    name: Check minimal version requirements of dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - nightly-pin
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just
      - name: Resolve pinned nightly
        id: resolve
        run: |
          if [ "${{ matrix.toolchain }}" = "nightly-pin" ]; then
            resolved_toolchain="$(just --evaluate nightly_toolchain)"
          else
            resolved_toolchain="${{ matrix.toolchain }}"
          fi
          echo "resolved_toolchain=${resolved_toolchain}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.resolved_toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: ${{ env.resolved_toolchain }}
      - uses: taiki-e/install-action@cargo-hack
      - uses: taiki-e/install-action@cargo-minimal-versions
      - name: Check build with minimal versions
        run: just minimal-versions

  format:
    name: Check format and spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@taplo
      - run: just check-fmt-all

  lint:
    name: Run lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: taiki-e/install-action@just
      - run: just lint
