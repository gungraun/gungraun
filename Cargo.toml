# spell-checker: ignore polonius
[workspace]
members = [
  "crates/gungraun",
  "crates/gungraun-common",
  "crates/gungraun-runner",
  "crates/gungraun-macros",
  "crates/gungraun-summary",
  "crates/valgrind-requests",
  "crates/gungraun-tests",
  "crates/valgrind-requests-tests",
]
resolver = "3"

[workspace.package]
categories = ["development-tools::profiling", "development-tools::testing"]
edition = "2024"
homepage = "https://github.com/gungraun/gungraun"
keywords = ["performance", "benchmark", "profiling", "valgrind", "callgrind"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/gungraun/gungraun"
rust-version = "1.85.1"
version = "0.19.4"

[workspace.dependencies]
anyhow = { version = "1.0.46" }
approx = { version = "0.5" }
assert_cmd = { version = "2.0" }
bincode-next = { version = ">=2,<=3.1", default-features = false, features = [
  "serde",
  "std",
] }
bindgen = { version = ">=0.69, <0.73" }
bon = { version = "3.9" }
cargo_metadata = { version = "0.20" }
cc = { version = "1.0.100" }
cfg-if = { version = "1" }
clap = { version = "4.0.12", features = ["derive", "env"] }
colored = { version = ">=2.2, <4" }
crossbeam = { version = "0.8" }
cty = { version = "0.2" }
derive_more = { version = ">=0.99, <3", default-features = false }
either-or-both = { version = "0.3" }
env_logger = { version = ">=0.7, <0.12" }
fs_extra = { version = "1.3" }
fundu = { version = "2" }
glob = { version = "0.3" }
indexmap = { version = "2.2.3", features = ["serde"] }
inferno = { version = "0.12", default-features = false, features = [
  'multithreaded',
] }
itertools = { version = "0.15" }
log = { version = "0.4.8" }
nix = { version = "0.31" }
num_cpus = { version = "1" }
once_cell = { version = "1" }
os_str_bytes = { version = "7" }
parking_lot = { version = "0.12" }
polonius-the-crab = { version = "0.5" }
predicates = { version = "3" }
pretty_assertions = "1.1"
proc-macro-error3 = "3.0.0"
proc-macro2 = "1.0.91"
quote = "1.0.35"
regex = { version = "1.12" }
rstest = { version = ">=0.17, <0.27", default-features = false }
rustc_version = { version = "0.4" }
sanitize-filename = { version = "0.6" }
schemars = { version = "1.0.4" }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = { version = "1.0.127" }
serde_test = { version = "1.0.177" }
serde_yaml = { version = "0.9" }
serial_test = { version = "3" }
shlex = { version = "2.0" }
signal-hook = { version = "0.4" }
simplematch = "0.3"
statrs = { version = "0.18" }
strum = { version = "0.28" }
syn = { version = "3", features = ["full", "extra-traits"] }
tempfile = { version = "3.10.0" }
tera = { version = "2.1.0" }
thiserror = { version = "2.0.3" }
trybuild = "1.0.18"
valico = { version = "4" }
version-compare = { version = "0.2" }
which = { version = ">=5, <9" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
arbitrary_source_item_ordering = "warn"
assertions_on_result_states = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
create_dir = "warn"
dbg_macro = "warn"
derive_partial_eq_without_eq = "warn"
doc_link_code = "warn"
else_if_without_else = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
enum_glob_use = "allow"
equatable_if_let = "warn"
fallible_impl_from = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
implicit_clone = "warn"
infinite_loop = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
iter_without_into_iter = "warn"
large_stack_frames = "warn"
literal_string_with_formatting_args = "warn"
lossy_float_literal = "warn"
map_with_unused_argument_over_ranges = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
mixed_read_write_in_expression = "warn"
module_name_repetitions = "allow"
multiple_inherent_impl = "warn"
multiple_unsafe_ops_per_block = "warn"
must_use_candidate = "allow"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
needless_raw_strings = "warn"
non_zero_suggestions = "warn"
nonstandard_macro_braces = "warn"
or_fun_call = "warn"
partial_pub_fields = "warn"
path_buf_push_overwrite = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
pub_without_shorthand = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_self_not_must_use = "allow"
same_name_method = "warn"
semicolon_inside_block = "warn"
single_option_map = "warn"
str_to_string = "warn"
string_lit_chars_any = "warn"
suboptimal_flops = "warn"
suspicious_operation_groupings = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
too_long_first_doc_paragraph = "warn"
too_many_arguments = "allow"
too_many_lines = "allow"
trait_duplication_in_bounds = "warn"
try_err = "warn"
tuple_array_conversions = "warn"
type_repetition_in_bounds = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unnecessary_struct_initialization = "warn"
unneeded_field_pattern = "warn"
unused_peekable = "warn"
unused_result_ok = "warn"
unused_rounding = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
verbose_file_reads = "warn"
