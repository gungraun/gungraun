# spell-checker:ignore autobenches

[package]
authors = ["Joining7943 <joining@posteo.de>"]
autobenches = false
categories.workspace = true
description = "Tests for gungraun"
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
name = "benchmark-tests"
publish = false
readme = "../README.md"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[features]
cachegrind = ["gungraun/cachegrind"]

[dependencies]
anyhow = { workspace = true }
cargo_metadata = { workspace = true }
colored = { workspace = true }
either-or-both = { workspace = true }
fs_extra = { workspace = true }
glob = { workspace = true }
gungraun = { path = "../gungraun", features = ["act"] }
gungraun-runner = { path = "../gungraun-runner", features = ["__fixtures"] }
minijinja = { workspace = true }
once_cell = { workspace = true }
pretty_assertions = { workspace = true }
regex = { workspace = true }
rustc_version = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
signal-hook = { workspace = true }
simplematch = { workspace = true }
tempfile = { workspace = true }
valico = { workspace = true }
version-compare = { workspace = true }

[dev-dependencies]
bon = { workspace = true }
glob = { workspace = true }
rstest = { workspace = true }

[[bin]]
name = "bench"
path = "src/bench.rs"

