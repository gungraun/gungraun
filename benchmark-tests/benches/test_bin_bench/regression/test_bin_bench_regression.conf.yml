# Test Case: `test_bin_bench_regression`
#
# Description:
#   Validates soft-limit regression checking and `fail_fast` behavior for
#   Callgrind, Cachegrind, and Perf binary benchmarks. A final sentinel
#   benchmark reveals whether execution continued after a detected regression.
#
# Test Steps:
#   1. Run smaller workloads to establish non-regressing baselines
#   2. Run larger workloads to exceed each tool's zero-percent soft limit
#   3. Repeat with `fail_fast=true` and `fail_fast=false`
#
# Test Inputs:
#   - Callgrind and Cachegrind `Ir` soft limits set to `0.0`
#   - Perf events `task-clock`, `cpu-clock`, `faults`, and `context-switches`,
#     with a `*task-clock*` soft limit set to `0.0`
#   - The explicit `task-clock,cpu-clock,faults,context-switches` event set is
#     intentionally limited to events available across Linux systems and the
#     Github CI;
#   - Array lengths 4/5 for Valgrind and 10000/20000 for Perf
#   - A `should_not_run_after_regression` sentinel benchmark
#
# Expected Outcomes:
#   - Baseline runs pass with exit code 0; regression runs exit with code 3
#   - `fail_fast=true` stops before the sentinel benchmark
#   - `fail_fast=false` reports every configured tool regression and reaches the
#     sentinel benchmark
#   - FreeBSD doesn't run Perf and uses the non-Perf expectations

template: test_bin_bench_regression.rs.j2
groups:
  - runs:
      - args: []
        expected:
          stdout:
            default: expected_stdout.1
            x86_64-unknown-freebsd: expected_stdout.freebsd.1
          no_stderr: true
          exit_code: 0
        template_data:
          array_length: 4
          # high array length for perf to push the shaky task-clock into the
          # middle of the ms range to avoid a unit change in the output
          perf_array_length: 10000
          fail_fast: true
      - args: []
        expected:
          stdout: expected_stdout.fail-fast
          stderr:
            default: expected_stderr.fail-fast
            x86_64-unknown-freebsd: expected_stderr.freebsd.fail-fast
          exit_code: 3
        template_data:
          array_length: 5
          perf_array_length: 20000
          fail_fast: true
  - runs:
      - args: []
        expected:
          stdout:
            default: expected_stdout.1
            x86_64-unknown-freebsd: expected_stdout.freebsd.1
          no_stderr: true
          exit_code: 0
        template_data:
          array_length: 4
          perf_array_length: 10000
          fail_fast: false
      - args: []
        expected:
          stdout:
            default: expected_stdout.no-fail-fast
            x86_64-unknown-freebsd: expected_stdout.freebsd.no-fail-fast
          stderr:
            default: expected_stderr.no-fail-fast
            x86_64-unknown-freebsd: expected_stderr.freebsd.no-fail-fast
          exit_code: 3
        template_data:
          array_length: 5
          perf_array_length: 20000
          fail_fast: false
