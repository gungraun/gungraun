# Test Case: `test_bin_bench_setup_and_teardown`
#
# Description:
#   Tests binary setup and teardown functions, including arguments, module
#   namespacing, benchmark-level inheritance, bench-level overrides, low-level
#   API construction, execution order, and Perf run modes. Also verifies that
#   assistants are skipped when loading an existing baseline.
#
# Test Steps:
#   1. Run with `--nocapture` and compare assistant ordering and generated files
#   2. Create baseline data as preparation for the load-only assertion
#   3. Run with `--load-baseline --baseline --nocapture` and confirm assistants
#      are not executed
#
# Test Inputs:
#   - Setup/teardown functions with arguments and namespaced module functions
#   - `#[binary_benchmark]` assistants inherited or overridden by individual
#     benches
#   - Low-level `BinaryBenchmark` and `Bench` setup/teardown definitions
#   - Perf direct, sampling, calibration, and sampling-plus-calibration modes
#     with `task-clock`, `cpu-clock`, and `context-switches`. The explicit
#     `task-clock,cpu-clock,context-switches` event set is intentionally limited
#     to events available across Linux systems and the Github CI;
#
# Expected Outcomes:
#   - Stdout shows setup before each command and teardown afterward, with
#     correct arguments, namespacing, inheritance, and overrides
#   - Low-level and macro-defined benchmarks produce their declared files
#   - Baseline loading emits no setup/teardown output
#   - Perf assistants execute once per binary benchmark run regardless of
#     sampling or calibration
#   - FreeBSD doesn't run Perf and uses the non-Perf fallback expectations

groups:
  - runs:
      - args: ["--nocapture"]
        expected:
          stdout:
            default: expected_stdout.1
            x86_64-unknown-freebsd: expected_stdout.freebsd.1
          files:
            default: expected_files.1.yml
            x86_64-unknown-freebsd: expected_files.freebsd.1.yml
      # We're not testing the --save-baseline or --load-baseline options. We
      # just want to ensure that the setup and teardown functions aren't
      # executed if `--load-baseline` is given.
      - args: ["--save-baseline"]
      - args: ["--load-baseline", "--baseline", "--nocapture"]
        expected:
          stdout:
            default: expected_stdout.2
            x86_64-unknown-freebsd: expected_stdout.freebsd.2
