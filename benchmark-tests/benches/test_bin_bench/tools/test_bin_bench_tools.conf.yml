# Test Case: `test_bin_bench_tools`
#
# TODO: UPDATE DOCS, especially the new perf_override
#
# Description:
#   Tests running multiple Valgrind tools (Dhat, Massif, Bbv, Memcheck, Drd,
#   Helgrind, Perf) in a single benchmark run. Also validates the
#   `trace-children` option for subprocess instrumentation for Valgrind tools.
#
# Test Steps:
#   1. Run benchmarks with `--nocapture` and all tools enabled
#   2. Run again to verify baseline comparison works
#
# Test Inputs:
#   - `Dhat` with `--time-stamp=yes` argument
#   - `Massif` with default configuration
#   - `Bbv` with default configuration
#   - `Memcheck` with `--time-stamp=yes` argument
#   - `Drd` with default configuration
#   - `Helgrind` with default configuration
#   - `Perf` with default configuration
#   - `trace-children=yes/no` option for subprocess handling
#
# Expected Outcomes:
#   - All tools produce expected output files
#   - Stdout matches expected format (platform-specific for FreeBSD)
#   - No stderr output (clean execution)
#   - Subprocess instrumentation works with `trace-children` option for Valgrind
#     tools
#   - FreeBSD doesn't run perf and skips it silently
#   - FreeBSD platform has separate expected outputs and files without perf

groups:
  - runs:
      - args: ["--nocapture"]
        expected:
          files:
            default: expected_files.1a.yml
            x86_64-unknown-freebsd: expected_files.freebsd.1a.yml
          stdout:
            default: expected_stdout.1a
            x86_64-unknown-freebsd: expected_stdout.freebsd.1a
          no_stderr: true
      - args: ["--nocapture"]
        expected:
          files:
            default: expected_files.1b.yml
            x86_64-unknown-freebsd: expected_files.freebsd.1b.yml
          stdout:
            default: expected_stdout.1b
            x86_64-unknown-freebsd: expected_stdout.freebsd.1b
          no_stderr: true
