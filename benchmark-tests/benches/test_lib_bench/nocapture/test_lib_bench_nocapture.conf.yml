# Test Case: `test_lib_bench_nocapture`
#
# TODO: UPDATE DOCS
#
# Description:
#   Validates the `--nocapture` flag and its variants for controlling
#   stdout/stderr output capture during benchmark execution. Verify that perf
#   messages `Events enabled` and `Events disabled` are filtered but only if the
#   default tool is perf.
#
# Test Steps:
#   1. Run with no `--nocapture` (default: output captured)
#   2. Run with `--nocapture=false` (explicit off)
#   3. Run with `--nocapture` (implicit true)
#   4. Run with `--nocapture=true` (explicit on)
#   5. Run with `--nocapture=stdout` (discard only stderr)
#   6. Run with `--nocapture=stderr` (discard only stdout)
#
# Test Inputs:
#   - Benchmarks with setup/teardown functions that print to stdout and stderr;
#     Various `--nocapture` flag variations
#   - Benchmarks printing perf messages to stdout/stderr when perf is the
#     default tool and when it is not.
#
# Expected Outcomes:
#   - No flag and `--nocapture=false`: Output is captured (not shown inline)
#   - `--nocapture` and `--nocapture=true`: Both stdout and stderr shown inline
#   - `--nocapture=stdout` exposes stdout and discards stderr.
#   - `--nocapture=stderr` exposes stderr and discards stdout.
#   - The correct nocapture footer is shown or absent if --nocapture=false
#   - If perf is the default tool, Events enabled/disabled messages are filtered
#   - If perf is not the default tool, these messages are not filtered

groups:
  - runs:
      - args: []
        expected:
          stdout:
            default: expected_stdout.1
            x86_64-unknown-freebsd: expected_stdout.freebsd.1
          no_stderr: true
  - runs:
      - args: ["--nocapture=false"]
        expected:
          stdout:
            default: expected_stdout.1
            x86_64-unknown-freebsd: expected_stdout.freebsd.1
          no_stderr: true
  - runs:
      - args: ["--nocapture"]
        expected:
          stdout:
            default: expected_stdout.2
            x86_64-unknown-freebsd: expected_stdout.freebsd.2
          no_stderr: true
  - runs:
      - args: ["--nocapture=true"]
        expected:
          stdout:
            default: expected_stdout.2
            x86_64-unknown-freebsd: expected_stdout.freebsd.2
          no_stderr: true
  - runs:
      - args: ["--nocapture=stdout"]
        expected:
          stdout:
            default: expected_stdout.3
            x86_64-unknown-freebsd: expected_stdout.freebsd.3
          no_stderr: true
  - runs:
      - args: ["--nocapture=stderr"]
        expected:
          stdout:
            default: expected_stdout.4
            x86_64-unknown-freebsd: expected_stdout.freebsd.4
          stderr:
            default: expected_stderr.1
            x86_64-unknown-freebsd: expected_stderr.freebsd.1
