# Test Case: `test_lib_bench_perf`
#
# TODO: UPDATE DOCS
#
# Description:
#   Validates Perf measurements for library benchmarks across event sets,
#   sampling, recording, calibration, multiplexing, selective measurement, and
#   log output. The benchmark binary uses Perf as its default tool and runs
#   three groups: `without_sampling`, `with_sampling` (one-second sample
#   duration), and `record` (recording enabled). Benchmarks sort a worst-case
#   array or compute Fibonacci numbers under various tool configurations.
#
# Test Steps:
#   1. Run the benchmark configuration twice and compare the declared stdout,
#      stderr, and generated-file fixtures of both runs.
#   2. Check the multiplexed sampling records of the thirty-event set: exactly
#      one matching event with a finite counter and `min_pcnt_running`
#      honoured (`0 < pcnt-running < 100`).
#   3. Check `perf_log!` output occurs exactly once without sampling or
#      recording and is appended to the log repeatedly while sampling.
#
# Test Inputs:
#   - Event sets with single, duplicated, two-set, and ten different events,
#     plus a thirty-event set that forces multiplexing
#   - A `dummy` event with and without `non_zero_metrics` filtering
#   - Default, sampling, recording, and calibration execution modes
#     (`DefaultCalibrate`, `Calibrate(1s)`), partly combined with
#     `record_args`
#   - Perf combined with Callgrind as default or additional tool, including
#     explicitly disabled Perf
#   - Benchmarks with a disabled entry point; one is measured selectively via
#     `perf_enable!`/`perf_disable!` around `fibonacci(20)`
#   - Scalar arguments, a const-generic argument, and range-generated
#     arguments (`iter = 2..=4`)
#
# Expected Outcomes:
#   - Declared output, error, and generated-file fixtures match for both runs
#   - A finite instruction counter with `0 < pcnt-running < 100` is accepted
#     for the multiplexed thirty-event case
#   - Perf logging has the expected occurrence count for each execution mode
#     (once without sampling or recording, appended while sampling)
#   - The `dummy`-metric and selectively unmeasured benchmarks produce empty
#     data sets without errors or panics

groups:
  - expected:
      script:
        default: |
          # Verify that `min_pcnt_running` is working
          jq -e -s --arg event 'cpu_core/instructions/u' '
            [.[] | select(.event == $event)]
            | if length == 1 then .[0]
              else error("expected exactly one \($event) event")
              end
            | (
                (.["counter-value"] | tonumber? | isfinite)
                and
                (.["pcnt-running"] | tonumber? | . > 0 and . < 100)
              )
          ' \
          with_sampling/thirty_events_then_multiplexing/perf.thirty_events_then_multiplexing.out

          # Verify that printing to the log file works and without sampling
          # occurrence counts are one
          [ $(grep -Fxc "Printing to log shouldn't be measured" \
            without_sampling/disabled_entry_point.with_arg/perf.disabled_entry_point.with_arg.log) -eq 1 ]

          [ $(grep -Fxc "Printing to log shouldn't be measured" \
            record/disabled_entry_point.with_arg/perf.disabled_entry_point.with_arg.log) -eq 1 ]

          # Verify that printing to the log file appends to the file when using
          # sampling
          [ $(grep -Fxc "Printing to log shouldn't be measured" \
            with_sampling/disabled_entry_point.with_arg/perf.disabled_entry_point.with_arg.log) -gt 1 ]
        x86_64-unknown-freebsd: null
    runs:
      - args: []
        expected:
          default:
            stderr: expected_stderr.1
            stdout: expected_stdout.1
            files: expected_files.1.yml
          x86_64-unknown-freebsd:
            no_stderr: true
            stdout: freebsd/expected_stdout.1
            files: freebsd/expected_files.1.yml
      - args: []
        expected:
          default:
            stderr: expected_stderr.2
            stdout: expected_stdout.2
            files: expected_files.2.yml
          x86_64-unknown-freebsd:
            no_stderr: true
            stdout: freebsd/expected_stdout.2
            files: freebsd/expected_files.2.yml
