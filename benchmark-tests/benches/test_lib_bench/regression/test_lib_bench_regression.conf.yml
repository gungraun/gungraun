# Test Case: `test_lib_bench_regression`
#
# TODO: UPDATE DOCS
#
# Description:
#   Validates soft- and hard-limit regression detection and fail-fast behavior
#   for Callgrind, Cachegrind, DHAT, and Perf. Exercises limits configured in
#   benchmark code as well as runner CLI arguments.
#
# Test Steps:
#   1. Reject floating-point hard limits for Callgrind, Cachegrind, and DHAT
#   2. Establish a non-regressing baseline, then fail fast for each tool
#   3. Establish a non-regressing baseline, then report all regressions without
#      fail-fast enabled
#   4. Set limits through CLI arguments, with and without CLI fail-fast
#
# Test Inputs:
#   - Soft limits at a 0% threshold so any metric increase is a regression
#   - Hard limits below observed metric values to force hard-limit regressions
#   - `--callgrind-limits`, `--cachegrind-limits`, `--dhat-limits`, and
#     `--perf-limits` CLI arguments
#   - `--regression-fail-fast` CLI flag
#   - Template-generated arrays of varying lengths to change benchmark metrics
#
# Expected Outcomes:
#   - Invalid floating-point hard limits produce clear errors for Callgrind,
#     Cachegrind, and DHAT; Perf is intentionally not part of this case
#   - Baseline runs exit successfully with code 0
#   - Detected regressions exit with code 3
#   - Per-tool fail-fast aborts after its first regression; without fail-fast,
#     output reports regressions from all configured tools
#   - Output identifies the violated metric, configured limit, and limit type

# spell-checker: ignore readsbytes
template: test_lib_bench_regression.rs.j2
groups:
  # 1: Provoke an error when parsing hard limits using a float instead of
  #    integer
  - runs:
      # 1.1 callgrind
      - args: []
        expected:
          no_stdout: true
          stderr: expected_stderr.callgrind-hard-limit
          exit_code: 1
          no_files: true
        template_data:
          callgrind_hard_limit: 200.0
      # 1.2 cachegrind
      - args: []
        expected:
          no_stdout: true
          stderr: expected_stderr.cachegrind-hard-limit
          exit_code: 1
          no_files: true
        template_data:
          cachegrind_hard_limit: Limit::Float(500000.0)
      # 1.3 dhat
      - args: []
        expected:
          no_stdout: true
          stderr: expected_stderr.dhat-hard-limit
          exit_code: 1
          no_files: true
        template_data:
          dhat_hard_limit: 5.0
      # No perf here because perf does not fail because of this kind or error
  # 2. regress all with fail-fast
  - runs:
      # 2.1
      - args: []
        expected:
          files:
            default: expected_files.1.yml
            x86_64-unknown-freebsd: freebsd/expected_files.1.yml
          stdout:
            default: expected_stdout.1
            x86_64-unknown-freebsd: freebsd/expected_stdout.1
          no_stderr: true
          exit_code: 0
        template_data: {}
      # 2.2 regress callgrind fail fast
      - args: []
        expected:
          files:
            default: expected_files.callgrind-fail-fast.yml
            x86_64-unknown-freebsd: freebsd/expected_files.callgrind-fail-fast.yml
          stdout: expected_stdout.callgrind-fail-fast
          stderr: expected_stderr.callgrind-fail-fast
          exit_code: 3
        template_data:
          callgrind_array_length: 100
          callgrind_fail_fast: true
      # 2.3 regress cachegrind fail fast
      - args: []
        expected:
          files:
            default: expected_files.cachegrind-fail-fast.yml
            x86_64-unknown-freebsd: freebsd/expected_files.cachegrind-fail-fast.yml
          stdout: expected_stdout.cachegrind-fail-fast
          stderr: expected_stderr.cachegrind-fail-fast
          exit_code: 3
        template_data:
          cachegrind_array_length: 500
          cachegrind_fail_fast: true
      # 2.4 regress dhat fail fast
      - args: []
        expected:
          files:
            default: expected_files.dhat-fail-fast.yml
            x86_64-unknown-freebsd: freebsd/expected_files.dhat-fail-fast.yml
          stdout: expected_stdout.dhat-fail-fast
          stderr: expected_stderr.dhat-fail-fast
          exit_code: 3
        template_data:
          dhat_array_length: 5
          dhat_fail_fast: true
      # 2.5 regress perf fail fast
      - args: []
        expected:
          default:
            files: expected_files.perf-fail-fast.yml
            stdout: expected_stdout.perf-fail-fast
            stderr: expected_stderr.perf-fail-fast
            exit_code: 3
          x86_64-unknown-freebsd:
            files: freebsd/expected_files.no-fail-fast.yml
            stdout: freebsd/expected_stdout.perf-fail-fast
            no_stderr: true
            exit_code: 0

        template_data:
          perf_array_length: 100
          perf_fail_fast: true
  # 3 regress all without fail fast
  - runs:
      # 3.1
      - args: []
        expected:
          files:
            default: expected_files.1.yml
            x86_64-unknown-freebsd: freebsd/expected_files.1.yml
          stdout:
            default: expected_stdout.1
            x86_64-unknown-freebsd: freebsd/expected_stdout.1
          no_stderr: true
          exit_code: 0
        template_data: {}
      # 3.2
      - args: []
        expected:
          default:
            files: expected_files.no-fail-fast.yml
            stdout: expected_stdout.no-fail-fast
            stderr: expected_stderr.no-fail-fast
            exit_code: 3
          x86_64-unknown-freebsd:
            files: freebsd/expected_files.no-fail-fast.yml
            stdout: freebsd/expected_stdout.no-fail-fast
            stderr: freebsd/expected_stderr.no-fail-fast
            exit_code: 3
        template_data:
          callgrind_array_length: 100
          cachegrind_array_length: 500
          dhat_array_length: 5
          perf_array_length: 1000
  # 4 regress all with limits set per command-line arguments
  - runs:
      # 4.1
      - args: []
        expected:
          files:
            default: expected_files.1.yml
            x86_64-unknown-freebsd: freebsd/expected_files.1.yml
          stdout:
            default: expected_stdout.1
            x86_64-unknown-freebsd: freebsd/expected_stdout.1
          no_stderr: true
          exit_code: 0
        template_data: {}
      # 4.2 Using a different config as in the benchmark with an additional
      #   estimated cycles
      - args:
          [
            "--callgrind-limits",
            "totalrw=0.0%",
            "--cachegrind-limits",
            "estimatedcycles=0%",
            "--dhat-limits",
            "readsbytes=0%,totalbytes=16",
            "--perf-limits",
            "instructions=0.0%",
          ]
        expected:
          files:
            default: expected_files.no-fail-fast.yml
            x86_64-unknown-freebsd: freebsd/expected_files.no-fail-fast.yml
          stdout:
            default: expected_stdout.args
            x86_64-unknown-freebsd: freebsd/expected_stdout.args
          stderr: expected_stderr.args
          exit_code: 3
        template_data:
          callgrind_array_length: 100
          cachegrind_array_length: 500
          dhat_array_length: 5
          perf_array_length: 1000
      # 4.3
      - args: ["--regression-fail-fast"]
        expected:
          files:
            # There are no differences to the second run since the .old files
            # were already created.
            default: expected_files.no-fail-fast.yml
            x86_64-unknown-freebsd: freebsd/expected_files.no-fail-fast.yml
          stdout: expected_stdout.args.fail-fast
          stderr: expected_stderr.callgrind-fail-fast
          exit_code: 3
        template_data:
          callgrind_array_length: 200
          cachegrind_array_length: 1000
          dhat_array_length: 6
          perf_array_length: 2000
