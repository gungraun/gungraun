# Test Case: `test_lib_bench_sandbox`
#
# TODO: UPDATE DOCS
#
# Description:
#   Tests `Sandbox` configuration for file isolation in library benchmarks for
#   Valgrind and perf. Validates sandbox creation, fixture handling, current
#   directory changes, setup/teardown execution per sample for perf sampling,
#   and sandbox-disabled execution.
#
# Test Steps:
#   1. Run benchmarks with `--nocapture` testing sandbox configurations
#   2. Run benchmarks a second time to verify comparison output
#
# Test Inputs:
#   - `Sandbox::new(true)` with fixtures: copies fixture files into sandbox
#   - `Sandbox::new(true)` without fixtures: empty sandbox created
#   - `Sandbox::new(false)`: no sandbox, runs in current directory
#   - `Sandbox::new(false)`: no sandbox with fixtures, executes normally without
#      copying fixtures
#   - `current_dir` option to change working directory within sandbox and if no
#      sandbox then in current benchmark directory
#   - perf in direct and sampling/calibration mode
#
# Expected Outcomes:
#   - Fixtures are copied into sandbox when specified
#   - Missing fixtures are not visible in an empty sandbox
#   - `current_dir` changes working directory correctly for Valgrind and perf
#   - With `Sandbox::new(false)`, files from the benchmark working directory are
#     visible
#   - Sandboxed perf in direct mode executes like Valgrind tools
#   - Perf when using sampling and calibration executes normally in a sandbox
#     and setup/teardown are executed once per sample

groups:
  - runs:
      - args: ["--truncate-description=no"]
        expected:
          stdout:
            default: expected_stdout.1
            x86_64-unknown-freebsd: freebsd/expected_stdout.1
      - args: ["--truncate-description=no"]
        expected:
          stdout:
            default: expected_stdout.2
            x86_64-unknown-freebsd: freebsd/expected_stdout.2
