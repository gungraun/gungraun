# Test Case: `test_lib_bench_sandbox`
#
# Description:
#   Tests library-benchmark file isolation for Valgrind and Perf. Covers exact
#   fixture visibility, benchmark-workdir access, sandbox-relative current
#   directories, disabled sandboxes, and per-sample Perf assistants.
#
# Test Steps:
#   1. Run benchmarks with `--nocapture` testing sandbox configurations
#   2. Run benchmarks a second time to verify comparison output
#
# Test Inputs:
#   - `Sandbox::new(true)` with and without the `one_line.fix` fixture
#   - `Sandbox::new(false)` with a fixture declaration that is intentionally
#     ignored while benchmark-workdir files remain visible
#   - `current_dir("foo")` with copied directory fixture `foo/bar.txt`
#   - Perf direct, sampling, calibration, and sampling-plus-calibration modes
#   - The explicit `task-clock,cpu-clock,context-switches` event set is
#     intentionally limited to events available across Linux systems and the
#     Github CI;
#
# Expected Outcomes:
#   - `one_line.fix` is visible only when copied into an enabled sandbox
#   - Disabled sandboxes expose benchmark-workdir files without copying fixtures
#   - `current_dir("foo")` exposes the copied `foo/bar.txt` for Valgrind and Perf
#   - Both runs match their declared output fixtures
#   - Perf setup/teardown executes once per sample in sampling and calibration
#     modes, unlike binary-benchmark assistants
#   - FreeBSD doesn't run Perf and uses the non-Perf expectations

groups:
  - runs:
      - args: ["--truncate-description=no"]
        expected:
          stdout:
            default: expected_stdout.1
            x86_64-unknown-freebsd: freebsd/expected_stdout.1
      - args: ["--truncate-description=no"]
        expected:
          stdout:
            default: expected_stdout.2
            x86_64-unknown-freebsd: freebsd/expected_stdout.2
