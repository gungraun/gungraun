# spell-checker: ignore polonius
[package]
authors = [
  "Joining7943 <joining@posteo.de>",
  "gamma0987 <gamma0987@posteo.de>",
  "Brook Heisler <redattack34@gmail.com>",
]
categories.workspace = true
description = """
Binary package needed by the Gungraun library. A high-precision, one-shot and \
consistent benchmarking framework/harness for Rust.
"""
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
name = "gungraun-runner"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
__fixtures = ["dep:bon", "runner"]
api = ["dep:serde", "either-or-both/serde"]
default = ["runner"]
runner = [
  "api",
  "dep:anyhow",
  "dep:approx",
  "dep:bincode-next",
  "dep:cargo_metadata",
  "dep:clap",
  "dep:colored",
  "dep:crossbeam",
  "dep:derive_more",
  "dep:env_logger",
  "dep:glob",
  "indexmap/serde",
  "dep:inferno",
  "dep:itertools",
  "dep:log",
  "dep:nix",
  "dep:num_cpus",
  "dep:os_str_bytes",
  "dep:parking_lot",
  "dep:polonius-the-crab",
  "dep:regex",
  "dep:sanitize-filename",
  "dep:serde",
  "dep:serde_json",
  "dep:shlex",
  "dep:simplematch",
  "dep:statrs",
  "dep:strum",
  "dep:tempfile",
  "dep:version-compare",
  "dep:which",
  "either-or-both/indexmap",
]
schema = ["summary", "dep:schemars", "either-or-both/schema"]
summary = ["api", "indexmap/serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
anyhow = { workspace = true, optional = true }
approx = { workspace = true, optional = true }
bincode-next = { workspace = true, optional = true }
bon = { workspace = true, optional = true }
cargo_metadata = { workspace = true, optional = true }
clap = { workspace = true, optional = true, features = [
  "derive",
  "env",
  "wrap_help",
] }
colored = { workspace = true, optional = true }
crossbeam = { workspace = true, optional = true }
derive_more = { workspace = true, optional = true, features = [
  "as_ref",
  "deref",
  "deref_mut",
] }
either-or-both = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
glob = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
inferno = { workspace = true, optional = true, default-features = false, features = [
  'multithreaded',
] }
itertools = { workspace = true, optional = true }
log = { workspace = true, optional = true }
nix = { workspace = true, optional = true, features = ["signal", "fs"] }
num_cpus = { workspace = true, optional = true }
os_str_bytes = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
polonius-the-crab = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
sanitize-filename = { workspace = true, optional = true }
schemars = { workspace = true, optional = true, features = ["indexmap2"] }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
shlex = { workspace = true, optional = true }
simplematch = { workspace = true, optional = true }
statrs = { workspace = true, optional = true }
strum = { workspace = true, optional = true, features = ["derive"] }
tempfile = { workspace = true, optional = true }
version-compare = { workspace = true, optional = true }
which = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
bon = { workspace = true }
pretty_assertions = { workspace = true }
rstest = { workspace = true }
serde_test = { workspace = true }
serde_yaml = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "gungraun-runner"
path = "src/main.rs"
required-features = ["runner"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
arbitrary_source_item_ordering = "warn"
assertions_on_result_states = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
create_dir = "warn"
dbg_macro = "warn"
derive_partial_eq_without_eq = "warn"
doc_link_code = "warn"
else_if_without_else = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
enum_glob_use = "allow"
equatable_if_let = "warn"
fallible_impl_from = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
implicit_clone = "warn"
infinite_loop = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
iter_without_into_iter = "warn"
large_stack_frames = "warn"
literal_string_with_formatting_args = "warn"
lossy_float_literal = "warn"
map_with_unused_argument_over_ranges = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
mixed_read_write_in_expression = "warn"
module_name_repetitions = "allow"
multiple_inherent_impl = "warn"
multiple_unsafe_ops_per_block = "warn"
must_use_candidate = "allow"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
needless_raw_strings = "warn"
non_zero_suggestions = "warn"
nonstandard_macro_braces = "warn"
or_fun_call = "warn"
partial_pub_fields = "warn"
path_buf_push_overwrite = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
pub_without_shorthand = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_self_not_must_use = "allow"
same_name_method = "warn"
semicolon_inside_block = "warn"
single_option_map = "warn"
str_to_string = "warn"
string_lit_chars_any = "warn"
suboptimal_flops = "warn"
suspicious_operation_groupings = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
too_long_first_doc_paragraph = "warn"
too_many_arguments = "allow"
too_many_lines = "allow"
trait_duplication_in_bounds = "warn"
try_err = "warn"
tuple_array_conversions = "warn"
type_repetition_in_bounds = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unnecessary_struct_initialization = "warn"
unneeded_field_pattern = "warn"
unused_peekable = "warn"
unused_result_ok = "warn"
unused_rounding = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
verbose_file_reads = "warn"
